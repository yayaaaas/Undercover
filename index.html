<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeu Undercover & Mr. White</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #313244;
      padding: 1.5rem 2rem;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .input-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
    }
    input[type="number"] {
      width: 60px;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #181825;
      color: #cdd6f4;
      text-align: center;
      font-size: 1rem;
    }
    button {
      background: #89b4fa;
      color: #11111b;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover { background: #b4befe; }
    .hidden { display: none; }
    .secret-word {
      font-size: 1.6rem;
      color: #a6e3a1;
      font-weight: bold;
      margin: 20px 0;
    }
    .white-role {
      color: #f38ba8;
    }
  </style>
</head>
<body>

  <!-- Écran de configuration -->
  <div class="card" id="setup-screen">
    <h2>Configuration</h2>
    <div class="input-group">
      <label>Civils :</label>
      <input type="number" id="nb-civils" value="3" min="1">
    </div>
    <div class="input-group">
      <label>Undercovers :</label>
      <input type="number" id="nb-undercovers" value="1" min="0">
    </div>
    <div class="input-group">
      <label>Mr. White :</label>
      <input type="number" id="nb-whites" value="1" min="0">
    </div>
    <button onclick="startGame()">Lancer la partie</button>
  </div>

  <!-- Écran de transition -->
  <div class="card hidden" id="pass-screen">
    <h2 id="player-title">Joueur 1</h2>
    <p>Prenez l'appareil sans montrer l'écran.</p>
    <button onclick="showRole()">Voir mon rôle / mot</button>
  </div>

  <!-- Écran de révélation -->
  <div class="card hidden" id="reveal-screen">
    <h2 id="reveal-header">Votre mot :</h2>
    <div class="secret-word" id="word-display">---</div>
    <p id="role-hint">Mémorisez-le bien !</p>
    <button onclick="nextPlayer()">Cacher et passer</button>
  </div>

  <!-- Écran de fin de distribution -->
  <div class="card hidden" id="end-screen">
    <h2>Distribution terminée !</h2>
    <p>Le débat commence. Donnez chacun un indice sans vous faire démasquer.</p>
    <button onclick="resetGame()">Nouvelle partie</button>
  </div>

  <script>
    const wordPairs = [
      { civil: "Chien", undercover: "Loup" },
      { civil: "Café", undercover: "Thé" },
      { civil: "Guitare", undercover: "Violon" },
      { civil: "Avion", undercover: "Hélicoptère" },
      { civil: "Pizza", undercover: "Burger" },
      { civil: "Soleil", undercover: "Lune" }
    ];

    let players = [];
    let currentPlayerIndex = 0;

    function startGame() {
      const civilsCount = parseInt(document.getElementById("nb-civils").value) || 0;
      const undercoversCount = parseInt(document.getElementById("nb-undercovers").value) || 0;
      const whitesCount = parseInt(document.getElementById("nb-whites").value) || 0;

      if (civilsCount + undercoversCount + whitesCount < 3) {
        alert("Il faut au minimum 3 joueurs au total !");
        return;
      }

      const pair = wordPairs[Math.floor(Math.random() * wordPairs.length)];
      players = [];

      for (let i = 0; i < civilsCount; i++) {
        players.push({ type: "civil", word: pair.civil });
      }
      for (let i = 0; i < undercoversCount; i++) {
        players.push({ type: "undercover", word: pair.undercover });
      }
      for (let i = 0; i < whitesCount; i++) {
        players.push({ type: "white", word: null });
      }

      // Mélange aléatoire (Fisher-Yates)
      for (let i = players.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [players[i], players[j]] = [players[j], players[i]];
      }

      currentPlayerIndex = 0;
      showPassScreen();
    }

    function showPassScreen() {
      document.getElementById("setup-screen").classList.add("hidden");
      document.getElementById("reveal-screen").classList.add("hidden");
      document.getElementById("end-screen").classList.add("hidden");

      document.getElementById("player-title").innerText = `Joueur ${currentPlayerIndex + 1}`;
      document.getElementById("pass-screen").classList.remove("hidden");
    }

    function showRole() {
      document.getElementById("pass-screen").classList.add("hidden");
      const current = players[currentPlayerIndex];
      const wordDisplay = document.getElementById("word-display");
      const headerDisplay = document.getElementById("reveal-header");
      const hintDisplay = document.getElementById("role-hint");

      if (current.type === "white") {
        headerDisplay.innerText = "Vous êtes :";
        wordDisplay.innerText = "Mr. White";
        wordDisplay.className = "secret-word white-role";
        hintDisplay.innerText = "Vous n'avez aucun mot ! Bluffez et devinez le mot des civils.";
      } else {
        headerDisplay.innerText = "Votre mot secret :";
        wordDisplay.innerText = current.word;
        wordDisplay.className = "secret-word";
        hintDisplay.innerText = "Mémorisez-le bien !";
      }

      document.getElementById("reveal-screen").classList.remove("hidden");
    }

    function nextPlayer() {
      currentPlayerIndex++;
      if (currentPlayerIndex < players.length) {
        showPassScreen();
      } else {
        document.getElementById("reveal-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.remove("hidden");
      }
    }

    function resetGame() {
      document.getElementById("end-screen").classList.add("hidden");
      document.getElementById("setup-screen").classList.remove("hidden");
    }
  </script>
</body>
</html>
